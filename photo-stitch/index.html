<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片拼接工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <a href="../" class="back-btn" title="返回工具箱">
          <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="title">
          <i class="bi bi-images"></i> 照片拼接工具
        </h1>
      </div>
      <div class="header-right">
        <button id="btnDownload" class="btn btn-primary" disabled>
          <i class="bi bi-download"></i> 保存结果
        </button>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="main-layout">
      <!-- Left Panel: Controls -->
      <aside class="panel">
        <!-- Layout Selector -->
        <div class="section">
          <label class="section-label">布局模板</label>
          <div class="layout-grid" id="layoutGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Options -->
        <div class="section">
          <label class="section-label">选项</label>
          <div class="option-row">
            <span class="option-label">间距</span>
            <input type="range" id="spacing" min="0" max="50" value="0" class="slider">
            <span class="option-value" id="spacingValue">0px</span>
          </div>
          <div class="option-row">
            <span class="option-label">背景色</span>
            <div class="color-options">
              <label class="color-radio">
                <input type="radio" name="bgColor" value="#ffffff" checked>
                <span class="color-dot" style="background:#ffffff; border: 1px solid #ddd"></span>
                <span>白色</span>
              </label>
              <label class="color-radio">
                <input type="radio" name="bgColor" value="#000000">
                <span class="color-dot" style="background:#000000"></span>
                <span>黑色</span>
              </label>
              <label class="color-radio">
                <input type="radio" name="bgColor" value="transparent">
                <span class="color-dot transparent-dot"></span>
                <span>透明</span>
              </label>
            </div>
          </div>
          <div class="option-row">
            <span class="option-label">圆角</span>
            <input type="range" id="cornerRadius" min="0" max="50" value="0" class="slider">
            <span class="option-value" id="cornerRadiusValue">0px</span>
          </div>
        </div>

        <!-- Actions -->
        <div class="section">
          <button id="btnLoadAll" class="btn btn-secondary btn-full">
            <i class="bi bi-plus-lg"></i> 添加照片
          </button>
          <button id="btnClearAll" class="btn btn-ghost btn-full">
            <i class="bi bi-trash3"></i> 清空所有
          </button>
        </div>

        <!-- Tips -->
        <div class="tips">
          <p><i class="bi bi-lightbulb"></i> 点击卡片中的 <strong>+</strong> 添加照片</p>
          <p><i class="bi bi-arrows-move"></i> 拖拽照片可调整位置</p>
          <p><i class="bi bi-download"></i> 点击「保存结果」下载拼接图</p>
        </div>
      </aside>

      <!-- Right Panel: Slots + Preview -->
      <div class="workspace">
        <!-- Image Slots -->
        <div class="slots-container" id="slotsContainer">
          <!-- Populated by JS -->
        </div>

        <!-- Preview -->
        <div class="preview-section">
          <div class="preview-header">
            <span class="preview-title">拼接预览</span>
            <button id="btnRefresh" class="btn btn-ghost btn-sm" title="刷新预览">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
          <div class="preview-area" id="previewArea">
            <canvas id="previewCanvas"></canvas>
            <div class="preview-placeholder" id="previewPlaceholder">
              <i class="bi bi-image"></i>
              <p>添加照片后点击预览</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept="image/*" multiple style="display:none">

  <script src="app.js"></script>
</body>
</html>
